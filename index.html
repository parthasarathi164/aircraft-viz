<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aircraft Dynamics Visualization</title>
  <style>
    body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; }
    #left-panel { flex: 1; position: relative; }
    #canvas-container { width: 100%; height: 100%; }
    #right-panel { width: 400px; padding: 20px; box-sizing: border-box; background: #f5f5f5; display: flex; flex-direction: column; }
    
    /* 3D View Buttons Overlay */
    .view-controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; }
    .view-controls button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; background: #fff; font-weight: bold; }
    .view-controls button:hover { background: #ddd; }

    /* Simulation Controls */
    .sim-controls { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
    .sim-controls div { display: flex; gap: 10px; align-items: center; }
    .sim-controls button { padding: 10px; font-weight: bold; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px;}
    .sim-controls button.stopped { background: #f44336; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
    canvas#liveChart { flex-grow: 1; max-height: 300px; background: white; border-radius: 8px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- Left: 3D Scene -->
  <div id="left-panel">
    <div id="canvas-container"></div>
    
    <!-- View Switcher -->
    <div class="view-controls">
      <button id="btn-view-home">Home View</button>
      <button id="btn-view-front">Front</button>
      <button id="btn-view-side">Side</button>
      <button id="btn-view-top">Top</button>
    </div>
  </div>

  <!-- Right: Charts and Controls -->
  <div id="right-panel">
    <h3>Flight Dynamics</h3>
    
    <select id="mode-select">
      <option value="short-period">Short-Period Mode</option>
      <option value="phugoid">Phugoid Mode</option>
      <option value="dutch-roll">Dutch Roll Mode</option>
    </select>
    
    <div class="tabs">
      <button id="tab-free" class="active">Free Response</button>
      <button id="tab-step">Step Response</button>
    </div>

    <!-- New Simulation Controls -->
    <div class="sim-controls">
      <div>
        <label>Duration (sec):</label>
        <input type="number" id="sim-duration" value="10" min="1" max="100" style="width: 60px;">
      </div>
      <button id="btn-play-pause">Start Simulation</button>
    </div>

    <canvas id="liveChart"></canvas>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
